[project]
name = "xfrieren"
version = "0.1.0"
description = "A character model with assistant-only LoRA loss."
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.5,<3",
    "transformers>=4.51,<5",
    "peft>=0.15,<1",
    "accelerate>=1.0,<2",
    "anthropic>=0.40,<1",
    "pyyaml>=6.0,<7",
    "huggingface-hub>=0.30,<1",
    "numpy>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfrieren"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
